services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    ports:
      - "5433:5432"
    volumes:
      - quiniela_nacional_postgres_data:/var/lib/postgresql
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:?POSTGRES_TEST_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?POSTGRES_TEST_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_TEST_USER:?POSTGRES_TEST_USER is required}
    ports:
      - "5434:5432"
    volumes:
      - quiniela_nacional_postgres_test_data:/var/lib/postgresql

volumes:
  quiniela_nacional_postgres_data:
  quiniela_nacional_postgres_test_data:
